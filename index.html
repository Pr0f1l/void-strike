'use strict';

// audio

const SFX = (() => {
  let ctx = null, master = null, droneGain = null;
  let droneOscs = [];
  let engineGain = null, engineOsc = null, engineOsc2 = null;
  let lastLaser = 0, lastELaser = 0;

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
    _startDrone();
    _startEngine();
  }

  function setVolume(v) { if (master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.05); }

  function _noise(dur) {
    const n = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function _osc(type, freq, gainVal, dur, freqEnd, when) {
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(gainVal, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.01);
  }

  function _startDrone() {
    droneGain = ctx.createGain();
    droneGain.gain.value = 0.018;
    droneGain.connect(master);
    [[55,.12],[82.5,.08],[110,.06],[165,.04]].forEach(([f,v]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      lfo.frequency.value = 0.08 + Math.random() * 0.06;
      lg.gain.value = f * 0.015;
      g.gain.value = v;
      lfo.connect(lg); lg.connect(o.frequency);
      o.connect(g); g.connect(droneGain);
      lfo.start(); o.start();
      droneOscs.push(o, lfo);
    });
    const notes = [110, 138.6, 164.8, 220, 185, 146.8];
    let ni = 0;
    const arp = () => {
      if (!ctx) return;
      _osc('triangle', notes[ni % notes.length], 0.022, 0.6, notes[(ni + 3) % notes.length] * 0.5);
      ni++;
      setTimeout(arp, 480 + Math.random() * 160);
    };
    setTimeout(arp, 800);
  }

  function _startEngine() {
    engineGain = ctx.createGain();
    engineGain.gain.value = 0;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 180;
    engineOsc = ctx.createOscillator();
    engineOsc2 = ctx.createOscillator();
    engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 58;
    engineOsc2.type = 'sine'; engineOsc2.frequency.value = 42;
    engineOsc.connect(filter); engineOsc2.connect(filter);
    filter.connect(engineGain); engineGain.connect(master);
    engineOsc.start(); engineOsc2.start();
  }

  function setEngine(intensity) {
    if (!engineGain) return;
    const t = ctx.currentTime;
    engineGain.gain.setTargetAtTime(intensity * 0.13, t, 0.08);
    engineOsc.frequency.setTargetAtTime(52 + intensity * 30, t, 0.1);
    engineOsc2.frequency.setTargetAtTime(38 + intensity * 18, t, 0.1);
  }

  function laser() {
    if (!ctx) return;
    const now = ctx.currentTime;
    if (now - lastLaser < 0.055) return;
    lastLaser = now;

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const dist = ctx.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) {
      const x = (i * 2) / 512 - 1;
      curve[i] = (Math.PI + 180) * x / (Math.PI + 180 * Math.abs(x));
    }
    dist.curve = curve;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(1400, now);
    o.frequency.exponentialRampToValueAtTime(320, now + 0.09);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    o.connect(dist); dist.connect(g); g.connect(master);
    o.start(now); o.stop(now + 0.1);

    _osc('square', 700, 0.04, 0.07, 160, now);
  }

  function eLaser() {
    if (!ctx) return;
    const now = ctx.currentTime;
    if (now - lastELaser < 0.12) return;
    lastELaser = now;
    _osc('square', 380, 0.07, 0.16, 100, now);
    _osc('sine',   190, 0.04, 0.20, 60,  now);
  }

  function explosion(size = 1) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const dur = 0.35 + size * 0.35;
    const vol = Math.min(size * 0.28, 0.55);

    const src = ctx.createBufferSource();
    src.buffer = _noise(dur + 0.1);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800 * Math.min(size, 2), now);
    lp.frequency.exponentialRampToValueAtTime(80, now + dur);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(vol, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(lp); lp.connect(ng); ng.connect(master);
    src.start(now); src.stop(now + dur + 0.1);

    if (size >= 1.5) {
      _osc('sine', 70, 0.45 * Math.min(size / 2, 1), 0.35, 18, now);
      _osc('sine', 140, 0.18, 0.2, 30, now);
    } else {
      _osc('sine', 120, 0.22, 0.18, 40, now);
    }

    if (size >= 2) {
      const crack = ctx.createBufferSource();
      crack.buffer = _noise(0.06);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 4000;
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.3, now); cg.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
      crack.connect(hp); hp.connect(cg); cg.connect(master);
      crack.start(now); crack.stop(now + 0.07);
    }
  }

  function shieldHit() {
    if (!ctx) return;
    const now = ctx.currentTime;
    _osc('sine', 2800, 0.18, 0.22, 1200, now);
    _osc('sine', 1800, 0.08, 0.18, 900, now);
  }

  function hullHit() {
    if (!ctx) return;
    const now = ctx.currentTime;
    explosion(0.6);
    _osc('sawtooth', 200, 0.2, 0.12, 40, now);
  }

  function waveStart(boss) {
    if (!ctx) return;
    const now = ctx.currentTime;
    if (boss) {
      [0, 0.28, 0.56].forEach(dt => {
        _osc('square', 180, 0.25, 0.2, 90, now + dt);
        _osc('square', 270, 0.12, 0.2, 135, now + dt);
      });
      _osc('sawtooth', 60, 0.3, 1.0, 30, now + 0.7);
    } else {
      [[0,300],[0.12,370],[0.25,440],[0.4,560],[0.55,680]].forEach(([dt,f]) =>
        _osc('triangle', f, 0.12, 0.3, f * 0.5, now + dt)
      );
    }
  }

  function upgradeSelect() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [[0,440],[0.07,554],[0.14,660],[0.22,880]].forEach(([dt,f]) =>
      _osc('sine', f, 0.1, 0.2, f * 0.6, now + dt)
    );
  }

  function gameOver() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [[0,440],[0.3,350],[0.68,260],[1.1,180]].forEach(([dt,f]) =>
      _osc('sawtooth', f, 0.18, 0.45, f * 0.5, now + dt)
    );
    const src = ctx.createBufferSource();
    src.buffer = _noise(1.8);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.15, now + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(now + 0.5); src.stop(now + 2.4);
  }

  function hitSpark() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = _noise(0.04);
    const hp = ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3000; hp.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    src.connect(hp); hp.connect(g); g.connect(master);
    src.start(now); src.stop(now + 0.05);
  }

  return { init, setVolume, setEngine, laser, eLaser, explosion, shieldHit, hullHit, waveStart, upgradeSelect, gameOver, hitSpark };
})();

function buildPlayerShip(){
  const g = new THREE.Group();
  const mBody  = new THREE.MeshStandardMaterial({color:0x1a3888,emissive:0x0a1e44,metalness:.85,roughness:.2});
  const mWing  = new THREE.MeshStandardMaterial({color:0x2255cc,emissive:0x112266,metalness:.7,roughness:.3});
  const mGlass = new THREE.MeshStandardMaterial({color:0x00ddff,emissive:0x0099dd,transparent:true,opacity:.55,metalness:.1,roughness:0});
  const mEng   = new THREE.MeshStandardMaterial({color:0x00aaff,emissive:0x00aaff,emissiveIntensity:4});
  const mAccent= new THREE.MeshStandardMaterial({color:0x00ffff,emissive:0x00ffff,emissiveIntensity:3});

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(.28,.55,3.2,8),mBody);
  fus.rotation.x = Math.PI/2; g.add(fus);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(.28,1.8,8),mBody);
  nose.rotation.x = -Math.PI/2; nose.position.z = -2.5; g.add(nose);

  const ck = new THREE.Mesh(new THREE.SphereGeometry(.38,10,8,0,Math.PI*2,0,Math.PI*.55),mGlass);
  ck.position.set(0,.22,-.6); g.add(ck);

  const stripe = new THREE.Mesh(new THREE.BoxGeometry(.06,.06,2.8),mAccent);
  stripe.position.set(0,.3,-.1); g.add(stripe);

  const mkWing=(s)=>{
    const bg=new THREE.BufferGeometry();
    const v=new Float32Array([0,0,.8, s*3.2,-.25,1.2, s*2.8,-.2,-.8, 0,0,-1.1]);
    const idx=new Uint16Array([0,1,2,0,2,3,0,2,1,0,3,2]);
    bg.setAttribute('position',new THREE.BufferAttribute(v,3));
    bg.setIndex(new THREE.BufferAttribute(idx,1));
    bg.computeVertexNormals();
    const m=new THREE.Mesh(bg,mWing);

    const tip=new THREE.Mesh(new THREE.BoxGeometry(.1,.04,.6),mAccent);
    tip.position.set(s*3.1,-.22,.2); m.add(tip);
    return m;
  };
  g.add(mkWing(-1)); g.add(mkWing(1));

  const mkFin=(s)=>{
    const fg=new THREE.BufferGeometry();
    const v=new Float32Array([0,0,1.6, s*.9,.6,1.1, s*.8,.3,-.2, 0,0,.6]);
    const idx=new Uint16Array([0,1,2,0,2,3,0,2,1,0,3,2]);
    fg.setAttribute('position',new THREE.BufferAttribute(v,3));
    fg.setIndex(new THREE.BufferAttribute(idx,1));
    fg.computeVertexNormals();
    return new THREE.Mesh(fg,mBody);
  };
  g.add(mkFin(-1)); g.add(mkFin(1));

  for(const ox of[-.5,0,.5]){
    const em = new THREE.Mesh(new THREE.CircleGeometry(.18,12),mEng);
    em.position.set(ox,-0.05+Math.abs(ox)*.1,1.7-Math.abs(ox)*.3);
    g.add(em);
    // Engine ring
    const er = new THREE.Mesh(new THREE.TorusGeometry(.22,.04,8,20),mAccent);
    er.rotation.x = Math.PI/2;
    er.position.copy(em.position);
    g.add(er);
  }

  player.boomLight = new THREE.PointLight(0x00aaff,3,8);
  player.boomLight.position.z = 1.5;
  g.add(player.boomLight);

  scene.add(g);
  return g;
}

const ET = {
  drone:  {col:0xff2200,em:0x441100,hp:25, spd:4,  sc:100, sz:.9, sh:'octa',si:0,  beh:'direct', minWave:1},
  scout:  {col:0xff8800,em:0x442200,hp:18, spd:8,  sc:150, sz:.65,sh:'cone',si:0,  beh:'zigzag', minWave:2},
  gunner: {col:0xffff00,em:0x443300,hp:60, spd:2.5,sc:280, sz:1.3,sh:'box', si:2.2,beh:'orbit',  minWave:3},
  hunter: {col:0xaa00ff,em:0x330055,hp:90, spd:5.5,sc:420, sz:1.1,sh:'tetra',si:1.6,beh:'strafe',minWave:4},
  elite:  {col:0x00ffaa,em:0x004433,hp:140,spd:6.5,sc:650, sz:1.0,sh:'octa',si:1.1,beh:'zigzag', minWave:6},
  bomber: {col:0x8844ff,em:0x220044,hp:200,spd:1.8,sc:500, sz:1.6,sh:'box', si:2.8,beh:'direct', minWave:5},
  boss:   {col:0xff0066,em:0x440011,hp:600,spd:1.6,sc:2500,sz:3.2,sh:'boss',si:.7, beh:'boss',   minWave:5},
};

function buildEnemyMesh(type){
  const t=ET[type];
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:t.col,emissive:t.em,metalness:.55,roughness:.45});

  if(type==='boss'){
    const core=new THREE.Mesh(new THREE.SphereGeometry(t.sz*.8,20,20),mat); g.add(core);
    [1,1.45,1.9].forEach((r,i)=>{
      const rm=new THREE.MeshStandardMaterial({color:t.col,emissive:t.em,emissiveIntensity:2.5});
      const ring=new THREE.Mesh(new THREE.TorusGeometry(t.sz*r,.16,8,40),rm);
      ring.rotation.set(i*.7,0,i*.4);
      ring.userData.rspd=(0.6+i*.35)*(i%2?1:-1);
      g.add(ring);
    });
    const can=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,t.sz,8),mat);
    can.rotation.x=-Math.PI/2; can.position.z=-t.sz; g.add(can);
    const pl=new THREE.PointLight(t.col,4,20); g.add(pl);
    return g;
  }

  let geo;
  switch(t.sh){
    case'octa': geo=new THREE.OctahedronGeometry(t.sz); break;
    case'cone': geo=new THREE.ConeGeometry(t.sz*.55,t.sz*1.6,7); break;
    case'box':  geo=new THREE.BoxGeometry(t.sz*1.6,t.sz*.85,t.sz*2.2); break;
    case'tetra':geo=new THREE.TetrahedronGeometry(t.sz); break;
    default:    geo=new THREE.SphereGeometry(t.sz);
  }
  g.add(new THREE.Mesh(geo,mat));
  const pl=new THREE.PointLight(t.col,1.5,7); g.add(pl);
  return g;
}

function spawnEnemy(type,pos){
  const t=ET[type];
  const mesh=buildEnemyMesh(type);
  mesh.position.copy(pos);
  scene.add(mesh);
  const scaling=1+G.wave*.18;
  enemies.push({
    type,mesh,
    hp:t.hp*scaling, maxHp:t.hp*scaling,
    spd:t.spd*(1+G.wave*.04),
    sc:t.sc, si:t.si,
    shootTimer:Math.random()*t.si||99,
    beh:t.beh,

// ═══════════════════════════════════════════════════
function fireBullet(fromPlayer,pos,dir){
  // Longer, brighter cylinders
  const geo = new THREE.CylinderGeometry(fromPlayer?.075:.065, fromPlayer?.075:.065, fromPlayer?1.4:1.0, 6);
  const mat = fromPlayer ? MAT.pbullet : MAT.ebullet;
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.copy(pos);
  const up = new THREE.Vector3(0,1,0);
  mesh.quaternion.setFromUnitVectors(up, dir.clone().normalize());
  const pl = new THREE.PointLight(fromPlayer?0x00ffff:0xff3300, fromPlayer?3.5:2.5, fromPlayer?6:4);
  mesh.add(pl);
  scene.add(mesh);
  const b = {
    mesh, dir:dir.clone().normalize(),
    spd:fromPlayer?65:22,
    dmg:fromPlayer?12*U.damage:8+G.wave*.5,
    life:fromPlayer?3.5:5,
    fromPlayer,
    homing:fromPlayer&&U.homing,
  };
  (fromPlayer?bullets:eBullets).push(b);
  if(fromPlayer) SFX.laser();
  else SFX.eLaser();
}

// ═══════════════════════════════════════════════════
//  SHOCKWAVE
// ═══════════════════════════════════════════════════
function addShockwave(pos, col, sz){
  const count = sz > 2 ? 3 : 2;
  for(let w=0;w<count;w++){
    const geo = new THREE.RingGeometry(0.1, 0.6, 32);
    const mat = new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0.7, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.copy(pos);
    mesh.rotation.set(
      (w===0?0:Math.random()*Math.PI),
      (w===0?0:Math.random()*Math.PI),
      w * Math.PI/3
    );
    scene.add(mesh);
    shockwaves.push({mesh, mat, life:0.5+w*.1, maxLife:0.5+w*.1, expandRate:sz*14+w*6, startSz:0.1});
  }
}

// ═══════════════════════════════════════════════════
//  EXPLOSION
// ═══════════════════════════════════════════════════
function boom(pos,col=0xff4400,sz=1,n=25){
  const geo=new THREE.BufferGeometry();
  const verts=new Float32Array(n*3);
  const vels=[];
  for(let i=0;i<n;i++){
    verts[i*3]=pos.x+(Math.random()-.5)*.6;
    verts[i*3+1]=pos.y+(Math.random()-.5)*.6;
    verts[i*3+2]=pos.z+(Math.random()-.5)*.6;
    vels.push(new THREE.Vector3((Math.random()-.5)*9*sz,(Math.random()-.5)*9*sz,(Math.random()-.5)*9*sz));
  }
  geo.setAttribute('position',new THREE.BufferAttribute(verts,3));
  const mat=new THREE.PointsMaterial({color:col,size:sz*.7,transparent:true,opacity:1,sizeAttenuation:true});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  const fl=new THREE.PointLight(col,7,14*sz);
  fl.position.copy(pos); scene.add(fl);
  particles.push({pts,geo,mat,vels,fl,life:1.8,maxLife:1.8});

  // Secondary ember layer
  if(sz>1){
    const eg=new THREE.BufferGeometry();
    const ev=new Float32Array(n*2*3);
    const evels=[];
    for(let i=0;i<n*2;i++){
      ev[i*3]=pos.x+(Math.random()-.5)*.4;
      ev[i*3+1]=pos.y+(Math.random()-.5)*.4;
      ev[i*3+2]=pos.z+(Math.random()-.5)*.4;
      evels.push(new THREE.Vector3((Math.random()-.5)*4*sz,(Math.random()-.5)*4*sz,(Math.random()-.5)*4*sz));
    }
    eg.setAttribute('position',new THREE.BufferAttribute(ev,3));
    const em=new THREE.PointsMaterial({color:0xffffff,size:.3,transparent:true,opacity:.9,sizeAttenuation:true});
    const eps=new THREE.Points(eg,em);
    scene.add(eps);
    particles.push({pts:eps,geo:eg,mat:em,vels:evels,fl:null,life:1.2,maxLife:1.2,skipLight:true});
  }

  addShockwave(pos, col, sz);
}

// ═══════════════════════════════════════════════════
//  ENGINE TRAIL EMIT
// ═══════════════════════════════════════════════════
function emitTrail(worldPos, moveDir, intensity){
  if(Math.random() > intensity * 0.9) return;
  const geo = new THREE.BufferGeometry();
  const v = new Float32Array(3);
  v[0] = worldPos.x + (Math.random()-.5)*.4;
  v[1] = worldPos.y + (Math.random()-.5)*.4;
  v[2] = worldPos.z + (Math.random()-.5)*.4;
  geo.setAttribute('position', new THREE.BufferAttribute(v,3));
  const col = Math.random() < 0.3 ? 0x00ffff : 0x0044ff;
  const mat = new THREE.PointsMaterial({color:col, size:.55+Math.random()*.4, transparent:true, opacity:.85, sizeAttenuation:true});
  const mesh = new THREE.Points(geo,mat);
  scene.add(mesh);
  const vel = new THREE.Vector3(
    (Math.random()-.5)*.8,
    (Math.random()-.5)*.8,
    (Math.random()-.5)*.8
  );
  if(moveDir) vel.addScaledVector(moveDir.clone().negate(), 1.5 + Math.random()*2);
  engineTrails.push({mesh, geo, mat, vel, life:.35+Math.random()*.25, maxLife:.6});
}

function flashEnemy(e){
  e.hitFlash = 0.08;
  e.mesh.traverse(child => {
    if(child.isMesh && child.material && child.material.emissive){
      child.material.emissiveIntensity = 12;
    }
  });
}
function tickEnemyFlash(e, dt){
  if(e.hitFlash > 0){
    e.hitFlash -= dt;
    if(e.hitFlash <= 0){
      const t = ET[e.type];
      e.mesh.traverse(child => {
        if(child.isMesh && child.material && child.material.emissive){
          child.material.emissiveIntensity = 1;
        }
      });
    }
  }
}

// ═══════════════════════════════════════════════════
//  WAVE SYSTEM
// ═══════════════════════════════════════════════════
let spawnQ=[], spawnT=0, waveActive=false, betweenWaves=false;

function getWaveComposition(w){
  const q=[];
  const add=(t,n)=>{for(let i=0;i<n;i++)q.push(t);};
  if(w%5===0&&w>0){
    add('boss',1);
    add('drone',Math.min(w,8));
    add('gunner',Math.floor(w/3));
    return q;
  }
  add('drone',Math.min(4+w*2,18));
  if(w>=2)add('scout',Math.min(w+1,10));
  if(w>=3)add('gunner',Math.min(w-1,7));
  if(w>=4)add('hunter',Math.min(w-2,6));
  if(w>=5)add('bomber',Math.min(Math.floor(w/2),4));
  if(w>=6)add('elite',Math.min(w-4,8));
  return q;
}

function startWave(){
  G.wave++;
  waveActive=true; betweenWaves=false;
  const q=getWaveComposition(G.wave);
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  spawnQ=q; spawnT=0;
  G.upgradePoints+=3+(G.wave>5?2:0);
  const isBoss=G.wave%5===0&&G.wave>0;
  showAnnounce(isBoss);
  SFX.waveStart(isBoss);
}

function doSpawn(){
  if(!spawnQ.length)return;
  const type=spawnQ.shift();
  const r=90+Math.random()*40;
  const theta=Math.random()*Math.PI*2;
  const phi=(Math.random()-.5)*Math.PI*.8;
  spawnEnemy(type, new THREE.Vector3(
    player.pos.x+r*Math.cos(phi)*Math.cos(theta),
    player.pos.y+r*Math.sin(phi),
    player.pos.z+r*Math.cos(phi)*Math.sin(theta)
  ));
}

function showAnnounce(boss=false){
  const el=document.getElementById('wave-ann');
  el.textContent = boss ? `⚠ BOSS WAVE ${G.wave} ⚠` : `WAVE ${G.wave}`;
  el.style.color = boss ? '#f04' : '#ff0';
  el.style.textShadow = boss ? '0 0 40px #f04,0 0 80px #f04' : '0 0 40px #ff0';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3000);
}

function updateRadar(){
  const el=document.getElementById('radar');el.innerHTML='';
  const R=48, cos=Math.cos(-player.yaw), sin=Math.sin(-player.yaw);
  enemies.forEach(e=>{
    if(!e.alive)return;
    const dx=e.mesh.position.x-player.pos.x;
    const dz=e.mesh.position.z-player.pos.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>200)return;
    const rx=(dx*cos-dz*sin)/200*R;
    const ry=(dx*sin+dz*cos)/200*R;
    const b=document.createElement('div');
    b.className='rblip';
    const bsz=e.type==='boss'?8:4;
    b.style.cssText=`width:${bsz}px;height:${bsz}px;left:${55+rx}px;top:${55-ry}px;background:${e.type==='boss'?'#f0f':'#f44'};box-shadow:0 0 ${bsz/2}px ${e.type==='boss'?'#f0f':'#f44'}`;
    el.appendChild(b);
  });
  const pd=document.createElement('div');
  pd.className='rblip';
  pd.style.cssText='width:6px;height:6px;left:52px;top:52px;background:#0ff;box-shadow:0 0 5px #0ff';
  el.appendChild(pd);
}

// ═══════════════════════════════════════════════════
function damagePlayer(dmg){
  if(player.invTimer>0)return;
  let shieldAbsorbed=false;
  if(G.shield>0){
    const ab=Math.min(G.shield,dmg);
    G.shield-=ab; dmg-=ab;
    if(ab>0){SFX.shieldHit(); shieldAbsorbed=true;}
  }
  if(dmg>0){
    G.hp-=dmg;
    if(G.hp<=0){G.hp=0;endGame();return;}
    screenFlash();
    SFX.hullHit();
    screenShake=Math.max(screenShake, 1.8);
    player.invTimer=.25;
  } else if(shieldAbsorbed){
    screenShake=Math.max(screenShake,.4);
  }
  G.combo=1; G.comboTimer=0;
}

function screenFlash(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(255,0,0,.32);pointer-events:none;z-index:50;animation:flashRed .35s forwards';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),400);
}

function killMsg(txt,col='#ff8800'){
  const feed=document.getElementById('kfeed');
  const d=document.createElement('div');
  d.textContent=txt; d.style.cssText=`color:${col};animation:fadeOut 2s forwards`;
  feed.appendChild(d); setTimeout(()=>d.remove(),2000);
}

function killEnemy(i){
  const e=enemies[i]; e.alive=false;
  const t=ET[e.type];
  const isBoss=e.type==='boss';
  boom(e.mesh.position.clone(), t.col, isBoss?4.5:1.8, isBoss?70:30);
  SFX.explosion(isBoss?4:1.5);
  if(isBoss) screenShake=Math.max(screenShake,4);
  else screenShake=Math.max(screenShake,.6);
  scene.remove(e.mesh); enemies.splice(i,1);
  G.combo=Math.min(G.combo+1,10); G.comboTimer=3;
  const pts=Math.floor(e.sc*G.wave*(G.combo*.5+.5));
  G.score+=pts; G.totalKills++; G.kills++;
  const msgs=['ENEMY DOWN','DESTROYED','ELIMINATED','NEUTRALIZED','OBLITERATED'];
  killMsg((isBoss?'★ BOSS ANNIHILATED ★':msgs[G.kills%msgs.length])+' +'+pts, isBoss?'#f0f':'#ff8800');
  if(isBoss){G.upgradePoints+=5;G.hp=Math.min(G.maxHp,G.hp+35);}
}

// ═══════════════════════════════════════════════════
//  UPDATE PLAYER
// ═══════════════════════════════════════════════════
let burstShots=0, totalShots=0, lastMoveDir=new THREE.Vector3();
function updatePlayer(dt){
  const sens=.0022;
  player.yaw-=pdx*sens;
  player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-pdy*sens));
  pdx=0; pdy=0;

  const spd=16*U.speed;
  const fwd=new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),-Math.cos(player.yaw)*Math.cos(player.pitch));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  const up=new THREE.Vector3(0,1,0);
  const mv=new THREE.Vector3();
  if(K.KeyW||K.ArrowUp)mv.addScaledVector(fwd,1);
  if(K.KeyS||K.ArrowDown)mv.addScaledVector(fwd,-1);
  if(K.KeyA||K.ArrowLeft)mv.addScaledVector(right,-1);
  if(K.KeyD||K.ArrowRight)mv.addScaledVector(right,1);
  if(K.Space)mv.addScaledVector(up,1);
  if(K.ShiftLeft||K.ShiftRight)mv.addScaledVector(up,-1);
  if(mv.length()>1)mv.normalize();
  player.pos.addScaledVector(mv,spd*dt);
  lastMoveDir.copy(mv);

  // Engine trail
  const moveMag = mv.length();
  if(moveMag > 0.01 && player.mesh){
    const euler=new THREE.Euler(player.pitch,player.yaw+Math.PI,player.roll*.28,'YXZ');
    const q=new THREE.Quaternion().setFromEuler(euler);
    const engWorld=player.pos.clone().add(new THREE.Vector3(0,-1.3,-4.5).applyQuaternion(q));
    const trailDir=fwd.clone();
    for(let i=0;i<(K.ShiftLeft||K.ShiftRight||K.Space?3:2);i++)
      emitTrail(engWorld.clone().add(new THREE.Vector3((Math.random()-.5)*.6,0,0).applyQuaternion(q)), trailDir, moveMag*U.speed);
    SFX.setEngine(Math.min(moveMag*U.speed*0.85, 1));
  } else {
    SFX.setEngine(0.05);
  }

  // Roll
  const troll=(K.KeyA||K.ArrowLeft?1:0)-(K.KeyD||K.ArrowRight?1:0);
  player.roll+=(troll*.28-player.roll)*dt*6;

  // Shoot
  player.fireTimer-=dt;
  player.invTimer=Math.max(0,player.invTimer-dt);
  const fr=.11/U.firerate;
  if(MB[0]&&player.fireTimer<=0){
    player.fireTimer=fr;
    totalShots++;
    const euler=new THREE.Euler(player.pitch,player.yaw,0,'YXZ');
    const sDir=new THREE.Vector3(0,0,-1).applyEuler(euler);
    const sPos=player.pos.clone().addScaledVector(sDir,3.5);
    const shots=U.multishot;
    const isBurst=U.rapidBurst&&totalShots%5===0;

    // Muzzle flash
    if(player.boomLight){ player.boomLight.intensity=12; setTimeout(()=>{if(player.boomLight)player.boomLight.intensity=3;},60); }

    const doFire=(d)=>{
      fireBullet(true,sPos.clone(),d);
      if(isBurst){
        setTimeout(()=>fireBullet(true,sPos.clone(),d),80);
        setTimeout(()=>fireBullet(true,sPos.clone(),d),160);
      }
    };
    for(let i=0;i<shots;i++){
      const spread=(shots>1)?((i-(shots-1)/2)*.12):0;
      const d=sDir.clone();
      if(shots>1){const pr=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));d.addScaledVector(pr,spread);}
      if(U.spread){d.x+=(Math.random()-.5)*.06;d.y+=(Math.random()-.5)*.06;}
      d.normalize(); doFire(d);
    }
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE CAMERA  (with screen-shake)
// ═══════════════════════════════════════════════════
function updateCamera(){
  const euler=new THREE.Euler(player.pitch,player.yaw,player.roll*.12,'YXZ');
  const q=new THREE.Quaternion().setFromEuler(euler);
  camera.position.copy(player.pos).add(new THREE.Vector3(0,2.2,8).applyQuaternion(q));

  // Screen shake
  if(screenShake>0.01){
    camera.position.x+=(Math.random()-.5)*screenShake;
    camera.position.y+=(Math.random()-.5)*screenShake*.6;
    screenShake*=0.82;
    if(screenShake<0.01)screenShake=0;
  }

  camera.setRotationFromEuler(euler);
  if(player.mesh){
    player.mesh.position.copy(player.pos).add(new THREE.Vector3(0,-1.3,-4.5).applyQuaternion(q));
    player.mesh.setRotationFromEuler(new THREE.Euler(player.pitch,player.yaw+Math.PI,player.roll*.28,'YXZ'));
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE BULLETS
// ═══════════════════════════════════════════════════
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.life-=dt;
    if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);continue;}
    if(b.homing&&enemies.length){
      let nd=Infinity, ne=null;
      enemies.forEach(e=>{if(!e.alive)return;const d=e.mesh.position.distanceTo(b.mesh.position);if(d<nd){nd=d;ne=e;}});
      if(ne){const t=ne.mesh.position.clone().sub(b.mesh.position).normalize();b.dir.lerp(t,dt*4).normalize();}
    }
    b.mesh.position.addScaledVector(b.dir,b.spd*dt);
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j]; if(!e.alive)continue;
      const hr=ET[e.type].sz*2.8;
      if(b.mesh.position.distanceTo(e.mesh.position)<hr){
        e.hp-=b.dmg;
        boom(b.mesh.position.clone(),0x00ffff,.2,5);
        SFX.hitSpark();
        flashEnemy(e);
        if(!U.piercing){scene.remove(b.mesh);bullets.splice(i,1);hit=true;}
        if(e.hp<=0)killEnemy(j);
        if(hit)break;
      }
    }
  }
}

function updateEBullets(dt){
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    b.life-=dt;
    if(b.life<=0){scene.remove(b.mesh);eBullets.splice(i,1);continue;}
    b.mesh.position.addScaledVector(b.dir,b.spd*dt);
    if(b.mesh.position.distanceTo(player.pos)<3.2){
      scene.remove(b.mesh);eBullets.splice(i,1);
      damagePlayer(b.dmg);
      boom(b.mesh.position.clone(),0xff2200,.4,8);
    }
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE ENEMIES
// ═══════════════════════════════════════════════════
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(!e.alive)continue;
    e.age+=dt;
    tickEnemyFlash(e, dt);
    const tp=player.pos.clone().sub(e.mesh.position);
    const dist=tp.length();
    const dir=tp.clone().normalize();

    if(e.type==='boss'){
      e.mesh.children.forEach(c=>{if(c.userData.rspd)c.rotation.y+=c.userData.rspd*dt;});
    }

    switch(e.beh){
      case'direct':
        e.mesh.position.addScaledVector(dir,e.spd*dt); break;
      case'zigzag':{
        const perp=new THREE.Vector3(-dir.z,0,dir.x);
        const d2=dir.clone().addScaledVector(perp,Math.sin(e.age*2.5+e.phase)*3.5).normalize();
        e.mesh.position.addScaledVector(d2,e.spd*dt); break;
      }
      case'strafe':
        if(dist>35){e.mesh.position.addScaledVector(dir,e.spd*dt);}
        else{const perp=new THREE.Vector3(-dir.z,0,dir.x);e.mesh.position.addScaledVector(perp,Math.sin(e.age+e.phase)*e.spd*dt);}
        break;
      case'orbit':{
        if(dist>45){e.mesh.position.addScaledVector(dir,e.spd*dt);}
        else{
          const orbitDir=new THREE.Vector3(-dir.z,0,dir.x);
          e.mesh.position.addScaledVector(orbitDir,e.spd*dt);
          e.mesh.position.addScaledVector(dir,(dist-40)*dt*.5);
        }
        break;
      }
      case'boss':{
        if(dist>45){e.mesh.position.addScaledVector(dir,e.spd*dt);}
        else{
          const ang=e.age*.45;
          const tgt=new THREE.Vector3(player.pos.x+Math.cos(ang)*38,player.pos.y+Math.sin(ang*.4)*8,player.pos.z+Math.sin(ang)*38);
          const toT=tgt.clone().sub(e.mesh.position).normalize();
          e.mesh.position.addScaledVector(toT,e.spd*dt);
        }
        break;
      }
    }

    if(e.type!=='boss'){e.mesh.rotation.y+=dt*.6;e.mesh.rotation.x+=dt*.35;}
    e.mesh.lookAt(player.pos);

    if(e.si>0){
      e.shootTimer-=dt;
      if(e.shootTimer<=0){
        e.shootTimer=e.si*(.75+Math.random()*.5);
        const sDir=player.pos.clone().sub(e.mesh.position).normalize();
        const ns=e.type==='boss'?4:1;
        for(let s=0;s<ns;s++){
          const d=sDir.clone();
          if(ns>1){d.x+=(Math.random()-.5)*.35;d.y+=(Math.random()-.5)*.35;d.normalize();}
          fireBullet(false,e.mesh.position.clone(),d);
        }
      }
    }

    if(dist<5){damagePlayer(15+G.wave*2);killEnemy(i);}
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE PARTICLES
// ═══════════════════════════════════════════════════
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt;
    if(p.life<=0){
      scene.remove(p.pts);
      if(!p.skipLight&&p.fl)scene.remove(p.fl);
      particles.splice(i,1); continue;
    }
    const t=p.life/p.maxLife;
    p.mat.opacity=t;
    if(!p.skipLight&&p.fl)p.fl.intensity=t*7;
    const pa=p.geo.attributes.position.array;
    for(let j=0;j<p.vels.length;j++){
      pa[j*3]+=p.vels[j].x*dt;
      pa[j*3+1]+=p.vels[j].y*dt;
      pa[j*3+2]+=p.vels[j].z*dt;
      p.vels[j].multiplyScalar(1-dt*2.2);
    }
    p.geo.attributes.position.needsUpdate=true;
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE SHOCKWAVES
// ═══════════════════════════════════════════════════
function updateShockwaves(dt){
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i]; s.life-=dt;
    if(s.life<=0){scene.remove(s.mesh);shockwaves.splice(i,1);continue;}
    const t=s.life/s.maxLife;
    s.mat.opacity=t*.7;
    const sc=1+(1-t)*s.expandRate*.06;
    s.mesh.scale.setScalar(sc);
  }
}

// ═══════════════════════════════════════════════════
//  UPDATE ENGINE TRAILS
// ═══════════════════════════════════════════════════
function updateEngineTrails(dt){
  for(let i=engineTrails.length-1;i>=0;i--){
    const t=engineTrails[i]; t.life-=dt;
    if(t.life<=0){scene.remove(t.mesh);engineTrails.splice(i,1);continue;}
    const frac=t.life/t.maxLife;
    t.mat.opacity=frac*.85;
    t.mat.size=(0.55+Math.random()*.3)*frac;
    const pa=t.geo.attributes.position.array;
    pa[0]+=t.vel.x*dt;
    pa[1]+=t.vel.y*dt;
    pa[2]+=t.vel.z*dt;
    t.vel.multiplyScalar(1-dt*3);
    t.geo.attributes.position.needsUpdate=true;
  }
}

// ═══════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════
let titleAngle=0;

function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-(G.lastT||t))/1000,.05);
  G.lastT=t;

  if(G.screen==='title'){
    titleAngle+=.0004;
    camera.position.set(Math.sin(titleAngle)*35,6+Math.sin(titleAngle*1.7)*4,Math.cos(titleAngle)*35);
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
    return;
  }

  if(G.screen==='playing'){
    updatePlayer(dt);
    updateCamera();
    updateBullets(dt);
    updateEBullets(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updateShockwaves(dt);
    updateEngineTrails(dt);

    if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=1;}

    if(G.maxShield>0&&U.shieldRegen>0) G.shield=Math.min(G.maxShield,G.shield+G.shieldRegen*dt);
    if(U.healthRegen>0) G.hp=Math.min(G.maxHp,G.hp+U.healthRegen*1.5*dt);

    if(spawnQ.length){spawnT-=dt;if(spawnT<=0){doSpawn();spawnT=.45+Math.random()*.2;}}

    if(!betweenWaves&&waveActive&&spawnQ.length===0&&enemies.filter(e=>e.alive).length===0){
      waveActive=false; betweenWaves=true;
      setTimeout(showUpgrades,1800);
    }

    updateHUD();
    updateRadar();
  } else {
    updateParticles(dt);
    updateShockwaves(dt);
    updateEngineTrails(dt);
    updateCamera();
  }

  renderer.render(scene,camera);
}

// ── Init ──
G.hiScore=parseFloat(localStorage.getItem('vsHi')||0);
if(G.hiScore>0) document.getElementById('hi-score').textContent='BEST: '+Math.floor(G.hiScore).toLocaleString();

requestAnimationFrame(loop);
</script>
